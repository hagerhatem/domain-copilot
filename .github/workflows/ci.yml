name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"
  SOLUTION_PATH: src/DomainCopilot.sln
  FRONTEND_DIR: frontend/domain-copilot-ui

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # .NET: restore, format check, build, test
  # ──────────────────────────────────────────────────────────────
  dotnet-build-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Format check (no changes allowed)
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --severity warn

      - name: Build (Release, no restore)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /warnaserror

      - name: Test with coverage
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./TestResults
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # .NET: dependency vulnerability scan
  # ──────────────────────────────────────────────────────────────
  dotnet-vulnerability-scan:
    name: .NET Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: dotnet-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Check for vulnerable packages
        run: |
          set -e
          echo "Scanning for known-vulnerable NuGet packages..."
          OUTPUT=$(dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected. See log above."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Angular: install, lint, build
  # ──────────────────────────────────────────────────────────────
  frontend-build-lint:
    name: Angular Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Angular: dependency vulnerability scan
  # ──────────────────────────────────────────────────────────────
  frontend-vulnerability-scan:
    name: npm Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install (clean, reproducible)
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────────
  # Secret scanning across full history (gitleaks — free, Action-based)
  # ──────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # ──────────────────────────────────────────────────────────────
  # Aggregate gate — set this single job as the required status check
  # ──────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    if: always()
    needs:
      - dotnet-build-test
      - dotnet-vulnerability-scan
      - frontend-build-lint
      - frontend-vulnerability-scan
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
